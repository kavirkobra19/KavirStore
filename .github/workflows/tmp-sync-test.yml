name: tmp-sync-test
on:
  push:
    branches: [tmp-sync-test]
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - name: KSP versions for Kotlin 2.0.x
        run: |
          curl -sSf https://repo1.maven.org/maven2/com/google/devtools/ksp/symbol-processing-gradle-plugin/maven-metadata.xml | grep -oE "<version>2\.0\.[0-9]+-[0-9.]+</version>" | sed -E 's/<[^>]+>//g' | sort -V | tail -25
          echo "--- plugin marker artifact:"
          for v in 2.0.21-1.0.28 2.0.21-1.0.27 2.0.21-1.0.26 2.0.21-1.0.25; do
            printf "%s -> " $v; curl -s -o /dev/null -w "%{http_code}\n" https://repo1.maven.org/maven2/com/google/devtools/ksp/com.google.devtools.ksp.gradle.plugin/$v/com.google.devtools.ksp.gradle.plugin-$v.pom
          done
