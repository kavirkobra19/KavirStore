name: tmp-sync-test
on:
  push:
    branches: [tmp-sync-test]
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - name: List public releases (read-only, public API)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for r in gpsapp myworkgps OrderManagement BuildApp; do
            echo "=== $r"
            gh api "repos/kavirkobra19/$r/releases?per_page=5" --jq '.[] | "\(.tag_name) pre=\(.prerelease) draft=\(.draft) pub=\(.published_at) assets=\([.assets[]|"\(.name):\(.size)"]|join(","))"' || echo "api error"
            gh api "repos/kavirkobra19/$r" --jq '"default=\(.default_branch) fork=\(.fork) desc=\(.description)"' || true
          done
