name: Build Kavir Store

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version name, e.g. 1.0.0 (a v1.0.0 tag/release is created)"
        required: true
        default: "1.0.0"
  pull_request:
    paths:
      - "app/**"
      - "*.kts"
      - "gradle.properties"

permissions:
  contents: write     # create the release
  actions: write      # start the catalog sync afterwards

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Work out the version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
            VERSION="${VERSION#v}"
          else
            VERSION="0.0.0-pr${{ github.run_number }}"
          fi
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION (versionCode ${{ github.run_number }})"

      - name: Prepare signing key
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kavir.jks"
          echo "KAVIR_KEYSTORE=$RUNNER_TEMP/kavir.jks" >> "$GITHUB_ENV"
          echo "KAVIR_KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "KAVIR_KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "KAVIR_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Build release APK
        if: env.HAS_KEYSTORE == 'true'
        run: >
          gradle :app:assembleRelease --no-daemon --stacktrace
          -PappVersionName=${{ steps.ver.outputs.name }}
          -PappVersionCode=${{ steps.ver.outputs.code }}
          -PcatalogRepo=${{ github.repository }}

      - name: Build debug APK (no signing key configured)
        if: env.HAS_KEYSTORE != 'true'
        run: >
          gradle :app:assembleDebug --no-daemon --stacktrace
          -PappVersionName=${{ steps.ver.outputs.name }}
          -PappVersionCode=${{ steps.ver.outputs.code }}
          -PcatalogRepo=${{ github.repository }}

      - name: Verify the signature
        if: env.HAS_KEYSTORE == 'true'
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          "$APKSIGNER" verify --print-certs "$APK"
          mkdir -p dist
          cp "$APK" "dist/KavirStore-v${{ steps.ver.outputs.name }}.apk"
          (cd dist && sha256sum "KavirStore-v${{ steps.ver.outputs.name }}.apk" > "KavirStore-v${{ steps.ver.outputs.name }}.apk.sha256")

      - name: Collect debug APK
        if: env.HAS_KEYSTORE != 'true'
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk "dist/KavirStore-debug-${{ steps.ver.outputs.name }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: KavirStore-${{ steps.ver.outputs.name }}
          path: dist/*

      - name: Publish GitHub Release
        if: env.HAS_KEYSTORE == 'true' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.ver.outputs.name }}"
          FILES=(dist/*)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            gh release create "$TAG" "${FILES[@]}" \
              --target "${{ github.sha }}" \
              --title "Kavir Store $TAG" \
              --generate-notes
          fi

      - name: Update the catalog
        if: env.HAS_KEYSTORE == 'true' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run sync-catalog.yml --ref main

      - name: Explain the missing key
        if: env.HAS_KEYSTORE != 'true'
        run: |
          echo "::warning::Secret KEYSTORE_BASE64 is not set, so only an unsigned-for-release DEBUG build was made and nothing was published. See docs/SETUP.fa.md."
